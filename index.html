<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бесконечная доска · карандаш, линейка, ластик, рука</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="boardCanvas"></canvas>

  <div class="toolbar">
    <button class="tool-btn active" id="pencilTool" title="Карандаш">
      <svg viewBox="0 0 24 24"><path d="M16.5 6.5l3 3L8 21H4v-4L16.5 6.5zM18 4l2 2L18.5 7.5 16 5 18 4z"/></svg>
      Карандаш
    </button>
    <button class="tool-btn" id="eraserTool" title="Ластик (стирает только линии)">
      <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.2 4.2a2 2 0 0 1 0 2.83L10.1 20.9a2 2 0 0 1-2.83 0l-4.2-4.2a2 2 0 0 1 0-2.83L13.4 3.56a2 2 0 0 1 2.83 0zM5.5 15.5l4 4L19 10l-4-4L5.5 15.5z"/></svg>
      Ластик
    </button>
    <button class="tool-btn active" id="rulerToggle" title="Показать/скрыть линейку">
      <svg viewBox="0 0 24 24"><path d="M2 8h20v8H2V8zm2 2v4h2v-2h2v2h2v-3h2v3h2v-2h2v2h2v-4H4z"/></svg>
      Линейка
    </button>
    <button class="tool-btn" id="handTool" title="Рука — перемещение по доске">
      <svg viewBox="0 0 24 24"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11h-.5V5a1.5 1.5 0 0 0-3 0v6h-.5V6.5a1.5 1.5 0 0 0-3 0V13l-1.6-1.6a1.5 1.5 0 0 0-2.12 2.12l4.23 4.23A5 5 0 0 0 12.66 19H15a4 4 0 0 0 4-4v-4z"/></svg>
      Рука
    </button>
    <div class="info">
      <span class="hint">↻ колесо — поворот линейки</span>
      <span class="angle-badge" id="angleDisplay">0°</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
